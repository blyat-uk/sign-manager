[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sign-manager"
# Keep equal to src/sign_manager/version.py (tests/test_identity.py checks).
version = "1.0.0"
description = "Desktop application for visually editing sign/label positions in ASS subtitle files"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "blyat-uk", email = "blyat-uk@users.noreply.github.com" }]
dependencies = [
    "PyQt6>=6.5",
    "python-mpv>=1.0.5",
    "qtawesome>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
]

[project.scripts]
sign-manager = "sign_manager.app:main"

[project.urls]
Repository = "https://github.com/blyat-uk/sign-manager"

[tool.hatch.build.targets.wheel]
packages = ["src/sign_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

# --- Briefcase (native installers) -------------------------------------------

[tool.briefcase]
project_name = "Sign Manager"
bundle = "uk.blyat"
version = "1.0.0"
url = "https://github.com/blyat-uk/sign-manager"
license = "MIT"
license-files = ["LICENSE"]
author = "blyat-uk"
author_email = "blyat-uk@users.noreply.github.com"

[tool.briefcase.app.sign-manager]
formal_name = "Sign Manager"
description = "Visually edit sign/label positions in ASS subtitle files"
long_description = """Load a video alongside its .ass subtitle file and drag signs/labels
directly on the video frame to reposition, restyle and retime them.
"""
sources = ["src/sign_manager"]
icon = "src/sign_manager/resources/icons/sign-manager"
# Pinned to the versions the test suite runs against.
requires = [
    "PyQt6==6.11.0",
    "PyQt6-Qt6==6.11.1",
    "PyQt6-sip==13.11.1",
    "python-mpv==1.0.8",
    "QtAwesome==1.4.2",
    "QtPy==2.4.3",
    "packaging==26.2",
]

[tool.briefcase.app.sign-manager.macOS]
# Apple Silicon only; the first-run download is arm64.
universal_build = false

[tool.briefcase.app.sign-manager.linux.system.debian]
system_runtime_requires = [
    "libmpv2",
    "ffmpeg",
    "libegl1",
    "libgl1",
    "libxkbcommon-x11-0",
    "libxcb-cursor0",
    "libxcb-icccm4",
    "libxcb-keysyms1",
    "libxcb-shape0",
    "libfontconfig1",
    "libdbus-1-3",
]

[tool.briefcase.app.sign-manager.linux.system.rhel]
system_runtime_requires = [
    "mpv-libs",
    "/usr/bin/ffmpeg",
    "/usr/bin/ffprobe",
    "xcb-util-cursor",
    "libxkbcommon-x11",
    "mesa-libEGL",
]

[tool.briefcase.app.sign-manager.linux.system.arch]
system_runtime_requires = [
    "mpv",
    "ffmpeg",
    "xcb-util-cursor",
    "libxkbcommon-x11",
]
