name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Mirrors .github/workflows/ci.yml so the release path doesn't fail
      # in ways a regular CI run wouldn't have caught.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3 \
            libmpv2 \
            ffmpeg

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

  build:
    name: Build ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact_name: sub-label-pos-linux
          - os: windows
            runner: windows-latest
            artifact_name: sub-label-pos-windows.exe
          - os: macos
            runner: macos-latest
            artifact_name: sub-label-pos-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Linux build: libmpv must be present at PyInstaller bundle time, even
      # though end users will still need their own libmpv installed.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 ffmpeg

      # macOS build: brew installs the mpv binary + libmpv. ffmpeg is a
      # runtime requirement for the editor frame extractor.
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg

      # Windows: python-mpv looks for mpv-2.dll on PATH at import time.
      # GitHub's windows-latest runner has no libmpv preinstalled. The
      # binary built below will NOT work for end users unless mpv-2.dll
      # is shipped alongside it (PyInstaller --add-binary) or end users
      # install mpv themselves. Distribution is intentionally out of scope
      # for this workflow — Windows users currently need mpv on PATH.
      # TODO: bundle mpv-2.dll from an upstream Windows mpv build; the
      # official mpv project does not host stable libmpv-only artifacts,
      # so a vendored mirror or external download step is needed.

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name sub-label-pos main.py

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/sub-label-pos.exe "out/${{ matrix.artifact_name }}"
          else
            mv dist/sub-label-pos "out/${{ matrix.artifact_name }}"
            chmod +x "out/${{ matrix.artifact_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: out/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
