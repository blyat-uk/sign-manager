name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact_name: sub-label-pos-linux
          - os: windows
            runner: windows-latest
            artifact_name: sub-label-pos-windows.exe
          - os: macos
            runner: macos-latest
            artifact_name: sub-label-pos-macos

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Linux build: libmpv must be present at PyInstaller bundle time, even
      # though end users will still need their own libmpv installed.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 ffmpeg

      # macOS build: brew installs the mpv binary + libmpv. ffmpeg is a
      # runtime requirement for the editor frame extractor.
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg

      # Windows: python-mpv looks for mpv-2.dll on PATH at import time.
      # GitHub's windows-latest runner has no libmpv preinstalled. The
      # binary built below will NOT work for end users unless mpv-2.dll
      # is shipped alongside it (PyInstaller --add-binary) or end users
      # install mpv themselves. Distribution is intentionally out of scope
      # for this workflow — Windows users currently need mpv on PATH.

      - name: Install build dependencies
        run: python -m pip install ".[build]"

      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name sub-label-pos main.py

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/sub-label-pos.exe "out/${{ matrix.artifact_name }}"
          else
            mv dist/sub-label-pos "out/${{ matrix.artifact_name }}"
            chmod +x "out/${{ matrix.artifact_name }}"
          fi

      - name: Set up rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG_MEGA }}

      - name: Upload to MEGA
        shell: bash
        env:
          MEGA_UPLOAD_PATH: ${{ vars.MEGA_UPLOAD_PATH }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          DEST="mega:${MEGA_UPLOAD_PATH}${RELEASE_TAG}/"
          # On macOS, --windowed --onefile produces both ./out/<name> (single
          # binary, after staging) and dist/sub-label-pos.app/. We only ship
          # the staged single file from out/ — keep this rclone invocation
          # file-targeted, not dir.
          rclone copy "./out/${ARTIFACT_NAME}" "$DEST" \
            --retries 5 --low-level-retries 20 --transfers 1
          # Verify the upload actually landed; rclone copy can report success
          # without the file appearing remotely under flaky MEGA conditions.
          if ! rclone lsf "$DEST" | grep -qFx "${ARTIFACT_NAME}"; then
            echo "ERROR: ${ARTIFACT_NAME} not found in ${DEST} after upload" >&2
            exit 1
          fi
          echo "Uploaded and verified ${DEST}${ARTIFACT_NAME}" >> "$GITHUB_STEP_SUMMARY"
