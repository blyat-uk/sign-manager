# Builds the libmpv + ffmpeg + ffprobe runtime-dependency zips that Sign
# Manager downloads on first run, verifies them on clean runners, and
# publishes them to the `runtime-deps-1` pre-release of this repository.
#
# Scripts live in packaging/runtime_deps/.
name: Runtime deps

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-deps
  cancel-in-progress: false

env:
  RELEASE_TAG: runtime-deps-1
  WIN_ZIP: sign-manager-deps-win-x86_64.zip
  MAC_ZIP: sign-manager-deps-mac-arm64.zip

jobs:
  build-win:
    name: Build (Windows x86_64 zip)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Build zip
        run: python packaging/runtime_deps/build_win.py --out dist --cache "$RUNNER_TEMP/rtdeps-cache"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deps-win
          path: dist/${{ env.WIN_ZIP }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-mac:
    name: Build (macOS arm64 zip)
    # Oldest arm64 runner: the bundled dylibs' minimum macOS version matches
    # the OS the Homebrew bottles were built for, so build on the oldest one.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mpv and ffmpeg from Homebrew
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          brew install mpv ffmpeg
          brew info mpv ffmpeg

      - name: Build zip
        run: python packaging/runtime_deps/build_mac.py --out dist --work build/mac

      - name: Show minimum macOS versions
        run: |
          stage=build/mac/sign-manager-deps
          echo "== vtool -show-build libmpv.dylib"
          vtool -show-build "$stage/libmpv.dylib"
          echo "== otool -l libmpv.dylib | LC_BUILD_VERSION"
          otool -l "$stage/libmpv.dylib" | grep -A3 LC_BUILD_VERSION
          echo "== minos of every bundled Mach-O file"
          for f in "$stage"/*; do
            [ -f "$f" ] || continue
            minos=$(otool -l "$f" | awk '/cmd LC_BUILD_VERSION/{found=1} found && /minos/{print $2; exit}')
            printf '%-8s %s\n' "${minos:-?}" "$(basename "$f")"
          done | sort -V

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deps-mac
          path: dist/${{ env.MAC_ZIP }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify-win:
    name: Verify (windows-latest)
    needs: build-win
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deps-win
          path: artifact

      - name: Unzip
        shell: pwsh
        run: Expand-Archive -Path "artifact/$env:WIN_ZIP" -DestinationPath deps

      - name: Verify
        run: python packaging/runtime_deps/verify.py deps

  verify-mac:
    name: Verify (macos-latest)
    needs: build-mac
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Homebrew mpv/ffmpeg are not installed
        run: |
          for f in mpv ffmpeg; do
            if brew list --formula "$f" >/dev/null 2>&1; then
              echo "Uninstalling preinstalled $f"
              brew uninstall --ignore-dependencies --force "$f"
            fi
          done
          if brew list --formula mpv >/dev/null 2>&1; then echo "mpv still installed"; exit 1; fi
          if brew list --formula ffmpeg >/dev/null 2>&1; then echo "ffmpeg still installed"; exit 1; fi
          echo "OK: neither mpv nor ffmpeg is installed via Homebrew"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deps-mac
          path: artifact

      - name: Unzip
        # `unzip` restores the Unix permission bits stored in the zip.
        run: |
          unzip -q "artifact/$MAC_ZIP" -d deps
          ls -l deps
          test -x deps/ffmpeg && test -x deps/ffprobe

      - name: Hide Homebrew prefix
        # Belt and braces: make sure nothing can resolve from /opt/homebrew.
        run: |
          if [ -d /opt/homebrew ]; then sudo mv /opt/homebrew /opt/homebrew.hidden; fi

      - name: Verify
        run: python packaging/runtime_deps/verify.py deps

      - name: Restore Homebrew prefix
        if: always()
        run: |
          if [ -d /opt/homebrew.hidden ]; then sudo mv /opt/homebrew.hidden /opt/homebrew; fi

  publish:
    name: Publish release
    needs: [verify-win, verify-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deps-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          test -f "$WIN_ZIP" && test -f "$MAC_ZIP"
          sha256sum "$WIN_ZIP" "$MAC_ZIP" > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          Runtime dependencies downloaded by Sign Manager on first run. Not an application release.

          | File | Platform |
          |---|---|
          | `sign-manager-deps-win-x86_64.zip` | Windows x64 |
          | `sign-manager-deps-mac-arm64.zip` | macOS arm64 (Apple Silicon) |

          Checksums are in `SHA256SUMS`.

          ## License notice

          These zips contain unmodified builds of **mpv** (libmpv, licensed GPL-2.0-or-later / LGPL-2.1-or-later; these builds are GPL) and **FFmpeg** (`ffmpeg`, `ffprobe` and the FFmpeg libraries, a GPL build). On macOS the only change is that the dynamic-library load paths were rewritten to `@loader_path` and the files ad-hoc re-signed so they can run from one folder.

          - Windows: libmpv from [shinchiro/mpv-winbuild-cmake](https://github.com/shinchiro/mpv-winbuild-cmake); FFmpeg from [BtbN/FFmpeg-Builds](https://github.com/BtbN/FFmpeg-Builds) (win64 gpl-shared).
          - macOS: Homebrew bottles of the [`mpv`](https://formulae.brew.sh/formula/mpv), [`ffmpeg`](https://formulae.brew.sh/formula/ffmpeg) and dependency formulae ([Homebrew/homebrew-core](https://github.com/Homebrew/homebrew-core)).

          Sources:

          - mpv: https://github.com/mpv-player/mpv
          - FFmpeg: https://ffmpeg.org/download.html#get-sources
          - mpv Windows build scripts: https://github.com/shinchiro/mpv-winbuild-cmake
          - FFmpeg Windows build scripts: https://github.com/BtbN/FFmpeg-Builds
          - Homebrew formulae: https://github.com/Homebrew/homebrew-core

          The corresponding source code is available from those upstreams. Each zip's `licenses/` folder contains the license texts and a `README.txt` naming the exact upstream versions, URLs and checksums used.
          EOF
          cat notes.md

      - name: Create or update release
        run: |
          assets=("dist/$WIN_ZIP" "dist/$MAC_ZIP" dist/SHA256SUMS)
          if gh release view "$RELEASE_TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; replacing assets and notes"
            gh release upload "$RELEASE_TAG" -R "$REPO" --clobber "${assets[@]}"
            gh release edit "$RELEASE_TAG" -R "$REPO" \
              --title "Runtime dependencies 1" --notes-file notes.md \
              --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" -R "$REPO" \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "Runtime dependencies 1" \
              --notes-file notes.md \
              "${assets[@]}"
          fi

      - name: Summary
        run: |
          base="https://github.com/$REPO/releases/download/$RELEASE_TAG"
          {
            echo "## Runtime deps published to \`$RELEASE_TAG\`"
            echo
            echo '| File | Size (bytes) | SHA-256 |'
            echo '|---|---:|---|'
            for z in "$WIN_ZIP" "$MAC_ZIP"; do
              echo "| \`$z\` | $(stat -c %s "dist/$z") | \`$(sha256sum "dist/$z" | cut -d' ' -f1)\` |"
            done
            echo
            echo 'Ready to paste:'
            echo
            echo '```python'
            for z in "$WIN_ZIP" "$MAC_ZIP"; do
              echo "# $z"
              echo "url=\"$base/$z\""
              echo "size=$(stat -c %s "dist/$z")"
              echo "sha256=\"$(sha256sum "dist/$z" | cut -d' ' -f1)\""
              echo
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
