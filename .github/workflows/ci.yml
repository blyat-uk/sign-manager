name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # PyQt6 needs xcb/egl system libs to construct a QApplication, even
      # under QT_QPA_PLATFORM=offscreen.
      # libmpv2 is required because src/sub_label_pos/services/mpv_service.py
      # does `import mpv` at module top, which calls ctypes.util.find_library
      # at import time — without libmpv, every test that touches main_window
      # (via fixtures) fails at collection.
      # ffmpeg is in the runtime dependency chain too; production code mocks
      # it in tests, but ffprobe is invoked at app startup.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3 \
            libmpv2 \
            ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v
