name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      # Keep the first-run download out of the runner's real profile.
      SIGN_MANAGER_DATA_DIR: ${{ github.workspace }}/.sign-manager-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyQt6 needs xcb/egl libs to construct a QApplication, even offscreen.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libfontconfig1 libdbus-1-3 \
            libmpv2 ffmpeg

      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Windows has no package for libmpv; this also exercises the downloader.
      - name: Runtime dependencies (Windows, first-run download)
        if: runner.os == 'Windows'
        run: python -m sign_manager --install-runtime-deps

      - name: Tests
        run: python -m pytest -v

      - name: Self-test
        run: python -m sign_manager --self-test
